<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Smiley</title>
</head>

<body>

    <div class="container">
        <div class="face stoic">
            <img src="stoic.png" alt="">
        </div>
        <div class="face happy">
            <img src="happy.png" alt="">
        </div>
        <div class="face sad">
            <img src="sad.png" alt="">
        </div>

        <div class="btn-div">
            <button class="happy-btn">:)</button>
            <button class="stoic-btn">:|</button>
            <button class="sad-btn">:(</button>
        </div>

    </div>

    <script src="script.js"></script>
</body>

</html>
