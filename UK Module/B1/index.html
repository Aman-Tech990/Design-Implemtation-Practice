<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Image Filter</title>
</head>

<body>

    <div id="container">
        <canvas id="canvas" width="460" height="320">
        </canvas>

        <div class="label-div">
            <label for="image">Image: </label>
            <select name="image" id="image">
                <option value="./athena.jpg">
                    image
                </option>
                <option value="./mona lisa.jpg">
                    mona lisa
                </option>
                <option value="./the kiss.jpg">
                    the kiss
                </option>
                <option value="./young pearl.jpg">
                    young pearl
                </option>
            </select>

            <label for="image">Filter: </label>
            <select name="filter" id="filter">
                <option value="filter">
                    filter
                </option>
                <option value="darken">
                    darken
                </option>
                <option value="brighten">
                    brighten
                </option>
            </select>
        </div>

    </div>


    <script src="script.js"></script>
</body>

</html>
